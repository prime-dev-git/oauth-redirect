
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Returning to Socials</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f7f8f5;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background: white;
            padding: 32px 24px;
            border-radius: 18px;
            max-width: 360px;
            width: 100%;
            box-sizing: border-box;
        }

        h2 {
            color: #222;
        }

        p {
            color: #777;
            line-height: 1.6;
        }

        button {
            border: 0;
            background: #6c5ce7;
            color: white;
            padding: 15px 24px;
            border-radius: 10px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>Login successful!</h2>

    <p id="status">
        Returning to Socials...
    </p>

    <button id="openApp">
        Return to Socials
    </button>

</div>

<script>
(() => {

    const CALLBACK_URL =
        'socialhub://oauth/callback' +
        window.location.search +
        window.location.hash;

    const status = document.getElementById('status');

    function returnToApp() {
        status.textContent = 'Opening Socials...';

        window.location.href = CALLBACK_URL;
    }

    document.getElementById('openApp')
        .addEventListener('click', returnToApp);

    // Attempt automatic redirect.
    window.addEventListener('load', () => {
        setTimeout(returnToApp, 500);
    });

})();
</script>

</body>
</html>
